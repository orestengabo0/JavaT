# ============================================================
# Application
# ============================================================
spring.application.name=JavaT

# ============================================================
# Database (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/javat
spring.datasource.username=postgres
spring.datasource.password=270811OLC0802023
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# validate — Hibernate checks the schema matches entities but never modifies it.
# Flyway owns all schema changes from this point forward.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
# Fail fast if a migration checksum changes — prevents silent schema drift
spring.flyway.out-of-order=false

# ============================================================
# JWT
# ============================================================
# Secret must be Base64-encoded and at least 256 bits (32 bytes) for HS256.
# CHANGE THIS in every environment — never commit a real secret.
app.jwt.secret=Y2hhbmdlLW1lLXRvLWEtc2VjdXJlLXJhbmRvbS1iYXNlNjQtZW5jb2RlZC1zZWNyZXQ=
app.jwt.expiration-ms=86400000
# 7 days in milliseconds
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=${spring.application.name}

# ============================================================
# Spring Security
# ============================================================
# Paths that bypass JWT authentication
app.security.public-paths[0]=/api/v1/auth/**
app.security.public-paths[1]=/v3/api-docs/**
app.security.public-paths[2]=/swagger-ui/**
app.security.public-paths[3]=/swagger-ui.html
app.security.public-paths[4]=/actuator/health

# ============================================================
# Mail (SMTP)
# ============================================================
# Replace with your real SMTP credentials before use.
# For local dev, use Mailpit (https://github.com/axllent/mailpit) on port 1025.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application-level mail settings
app.mail.from=noreply@javat.com
app.mail.from-name=JavaT
# Base URL used to build links in emails (no trailing slash)
app.mail.base-url=http://localhost:8080

# ============================================================
# Async (email thread pool)
# ============================================================
app.async.core-pool-size=2
app.async.max-pool-size=5
app.async.queue-capacity=100
app.async.thread-name-prefix=async-email-

# ============================================================
# Password Reset Token
# ============================================================
# How long a password reset token is valid (minutes)
app.auth.password-reset-token-expiry-minutes=15
