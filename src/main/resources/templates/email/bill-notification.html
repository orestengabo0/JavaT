<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: auto; padding: 24px;">

  <h2 style="color: #0F766E;">{{appName}} — Utility Billing</h2>

  <p>Dear {{customerName}},</p>

  <p style="line-height: 1.6;">{{message}}</p>

  <p style="margin: 32px 0;">
    <a href="{{portalUrl}}"
       style="display:inline-block; padding:12px 28px; background:#0F766E;
              color:#fff; text-decoration:none; border-radius:6px; font-weight:bold;">
      View Your Account
    </a>
  </p>

  <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;"/>

  <p style="font-size:12px; color:#999;">
    This is an automated message from {{appName}}. Please do not reply to this email.
  </p>

</body>
</html>
